<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mulțumim — cererea ta a fost trimisă | Optima Dental Clinic</title>
<meta name="description" content="Cererea ta a fost trimisă. Te contactăm în cel mai scurt timp pentru a confirma detaliile programării." />
<!-- pagină de confirmare: nu are ce căuta în rezultatele de căutare -->
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-black: #0d0f12;
    --card-dark: #13171c;
    --card-border-gold: rgba(184, 138, 91, .35);
    --gold: #b88a5b;
    --gold-metal: linear-gradient(100deg,
      #b8893f 0%, #e0b659 16%, #f2d488 34%, #fff8da 50%,
      #f2d488 66%, #e0b659 84%, #b8893f 100%);
    --text-white: #f5f3ee;
    --text-body: #c4c9c5;
    --text-muted: #8a958f;
    --whatsapp-green: #25d366;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(184, 138, 91, .10), transparent 62%),
      var(--bg-black);
    color: var(--text-body);
    font-family: var(--sans);
    line-height: 1.6;
    /* dvh keeps it centred on mobile even with the browser chrome showing */
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .card { width: 100%; max-width: 560px; text-align: center; }

  /* the mark carries a small "DENTAL CLINIC" line — below ~64px it turns to mush,
     so keep it near the size the landing-page header uses */
  .logo { height: 64px; width: auto; margin: 0 auto 22px; display: block; }
  @media (min-width: 520px) { .logo { height: 76px; margin-bottom: 26px; } }

  .seal {
    width: 68px; height: 68px; margin: 0 auto 22px;
    border-radius: 50%;
    border: 1px solid var(--card-border-gold);
    background: rgba(184, 138, 91, .10);
    display: flex; align-items: center; justify-content: center;
  }
  .seal svg { width: 32px; height: 32px; stroke: var(--gold); }

  h1 {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(30px, 8vw, 44px); line-height: 1.1;
    color: var(--text-white); margin: 0 0 16px;
  }
  h1 em {
    display: block; font-style: italic; font-weight: 400;
    background-image: var(--gold-metal);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: var(--gold);
  }
  .lead { font-size: clamp(15px, 4vw, 17px); margin: 0 0 12px; color: var(--text-white); }
  .sub { font-size: clamp(14px, 3.6vw, 15.5px); margin: 0; color: var(--text-body); }

  .divider {
    width: 56px; height: 1px; margin: 30px auto;
    background: var(--card-border-gold);
  }

  .urgent {
    font-size: clamp(15px, 4vw, 17px); font-weight: 600;
    color: var(--text-white); margin: 0 0 18px;
  }

  .actions { display: flex; flex-direction: column; gap: 12px; }
  @media (min-width: 520px) { .actions { flex-direction: row; } }

  .btn {
    flex: 1 1 auto;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 54px; padding: 14px 22px;
    border-radius: 999px; border: 0;
    font-family: var(--sans); font-size: 14px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase; text-decoration: none;
    transition: filter .18s ease, transform .18s ease;
  }
  .btn svg { width: 20px; height: 20px; flex: 0 0 auto; }
  .btn:active { transform: translateY(1px); }
  @media (hover: hover) { .btn:hover { filter: brightness(1.08); } }

  .btn--wa { background: var(--whatsapp-green); color: #06301a; }
  .btn--wa svg { fill: #06301a; }
  .btn--call { background-image: var(--gold-metal); color: #2c1d0e; }
  .btn--call svg { fill: #2c1d0e; }

  .back { margin: 28px 0 0; font-size: 13px; color: var(--text-muted); }
  .back a { color: var(--gold); text-decoration: none; }
  .back a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="card">
    <img
      class="logo"
      src="/oferte-voucher-meta/Creatives/optima-logo.png"
      alt="Optima Dental Clinic"
    />

    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5" />
      </svg>
    </div>

    <h1>
      Mulțumim!
      <em>Cererea ta a fost trimisă</em>
    </h1>

    <p class="lead">
      Te contactăm în cel mai scurt timp pentru a confirma detaliile programării tale.
    </p>
    <p class="sub">
      Verifică-ți telefonul — te sunăm de la <strong>0767 702 703</strong>.
    </p>

    <div class="divider" role="presentation"></div>

    <p class="urgent">Ai o urgență? Contactează-ne acum.</p>

    <div class="actions">
      <a
        class="btn btn--wa"
        href="https://wa.me/40767702703?text=Bun%C4%83%20ziua%2C%20am%20o%20urgen%C8%9B%C4%83%20%C8%99i%20a%C8%99%20dori%20ajutor."
        target="_blank"
        rel="noopener"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.6 14.2c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.4.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.2-.7-1.7-.9-2.3-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4s-1 1-1 2.5 1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5 4.4.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.3-.7.3-1.2.2-1.4-.1-.2-.3-.3-.6-.4z"/><path d="M20.5 3.5C18.3 1.2 15.3 0 12 0 5.4 0 0 5.4 0 12c0 2.1.6 4.2 1.6 6L0 24l6.2-1.6c1.7.9 3.7 1.4 5.7 1.4h.1c6.6 0 12-5.4 12-12 0-3.2-1.2-6.2-3.5-8.3zM12 21.5c-1.8 0-3.5-.5-5.1-1.4l-.4-.2-3.7 1 1-3.6-.2-.4c-1-1.6-1.5-3.4-1.5-5.4 0-5.5 4.5-9.9 9.9-9.9 2.6 0 5.1 1 7 2.9 1.9 1.9 2.9 4.4 2.9 7-.1 5.5-4.5 10-9.9 10z"/></svg>
        Scrie pe WhatsApp
      </a>

      <a class="btn btn--call" href="tel:+40767702703">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1 2 2.6 3.6 4.6 4.6l1.5-1.5c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V19c0 .6-.4 1-1 1-8.3 0-15-6.7-15-15 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .7-.2 1l-1.5 1.3z"/></svg>
        Sună acum
      </a>
    </div>

    <p class="back"><a href="/">Înapoi la site</a></p>
  </main>
</body>
</html>
